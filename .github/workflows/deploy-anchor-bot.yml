name: Deploy anchor-bot

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-anchor-bot.yml'
  workflow_dispatch:

# One rollout at a time: two overlapping rollouts would run three pollers on one token.
concurrency:
  group: deploy-anchor-bot
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT: a11y-hack26ath-267
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/a11y-hack26ath-267/anchor/anchor-bot
  NX_DAEMON: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx test api
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1024448251778/locations/global/workloadIdentityPools/github/providers/anchor
          service_account: anchor-deployer@a11y-hack26ath-267.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - name: Build and push the image
        run: |
          tag="$IMAGE:${GITHUB_SHA::7}"
          docker build -f apps/api/Dockerfile -t "$tag" .
          docker push "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # The new revision keeps the service's flags, secrets, and volume. Only the image changes.
      - run: gcloud run deploy anchor-bot --project="$PROJECT" --region="$REGION" --image="$TAG" --quiet
