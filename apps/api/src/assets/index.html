<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor · family group</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; background: #efe8df; color: #1c1917; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 28px 8px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  header span { color: #78716c; }
  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 24px; padding: 12px 28px 28px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #78716c; margin: 0 0 8px 4px; }
  .phone { height: 640px; border-radius: 28px; border: 9px solid #1c1917; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 14px 36px rgba(28,25,23,.18); background: #ece5dd; }
  .wa-top { background: #075e54; color: #fff; padding: 14px 16px; }
  .wa-top strong { display: block; font-size: 16px; }
  .wa-top small { opacity: .85; }
  .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 82%; padding: 8px 11px; border-radius: 10px; box-shadow: 0 1px 1px rgba(0,0,0,.08); white-space: pre-wrap; }
  .bubble .who { display: block; font-size: 11px; font-weight: 700; margin-bottom: 2px; }
  .sofia .who { color: #b45309; }
  .maria .who { color: #7c3aed; }
  .athina .who { color: #0369a1; }
  .anchor .who { color: #0f766e; }
  .sofia, .maria { align-self: flex-end; background: #dcf8c6; }
  .athina { align-self: flex-start; background: #fff7ed; }
  .anchor { align-self: flex-start; background: #fff; }
  .bubble img { display: block; max-width: 100%; border-radius: 8px; margin-top: 6px; }
  .compose { display: flex; gap: 6px; padding: 8px; background: #f0f0f0; }
  .compose input, .compose select { border: 0; border-radius: 20px; padding: 10px 12px; font: inherit; }
  .compose input { flex: 1; }
  .compose select { background: #fff; max-width: 110px; }
  .compose button { border: 0; border-radius: 50%; width: 42px; background: #128c7e; color: #fff; font-size: 16px; cursor: pointer; }
  .hood { background: #fff; border-radius: 16px; padding: 20px 22px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .hood h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #78716c; margin: 18px 0 8px; }
  .hood h2:first-child { margin-top: 0; }
  .muted { color: #a8a29e; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .actions button, .reply-row button { border: 0; border-radius: 10px; padding: 10px 14px; font: 600 13px inherit; cursor: pointer; background: #1c1917; color: #fff; }
  .actions button.secondary, .reply-row button.secondary { background: #e7e5e4; color: #1c1917; }
  .actions button:disabled { opacity: .4; cursor: not-allowed; }
  .reply-row { display: flex; gap: 8px; margin-top: 10px; }
  .reply-row input { flex: 1; border: 1px solid #e7e5e4; border-radius: 10px; padding: 10px 12px; font: inherit; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .free { background: #dcfce7; color: #166534; }
  .cued { background: #fef3c7; color: #92400e; }
  .struggled { background: #f5f5f4; color: #57534e; }
  .moment { border-top: 1px solid #f5f5f4; padding: 10px 0; }
  .moment:first-of-type { border-top: 0; }
  .next { font-size: 18px; font-weight: 650; }
</style>
</head>
<body>
<header>
  <h1>⚓ Anchor</h1>
  <span>Family memories, returning in the group chat.</span>
</header>
<main>
  <section>
    <p class="label">Family WhatsApp</p>
    <div class="phone">
      <div class="wa-top">
        <strong>Athina's family</strong>
        <small id="wa-note">Sofia · Maria · Athina · Anchor</small>
      </div>
      <div class="chat" id="chat"></div>
      <form class="compose" id="compose">
        <select id="from" aria-label="Sender">
          <option value="sofia">Sofia</option>
          <option value="maria">Maria</option>
        </select>
        <input id="news" placeholder="Maria's first day of school — she didn't want to let go of my hand" autocomplete="off">
        <button aria-label="Send">➤</button>
      </form>
    </div>
  </section>
  <section class="hood" id="hood"></section>
</main>
<script>
  const escape = (text) => String(text ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const names = { sofia: 'Sofia', maria: 'Maria', athina: 'Athina', anchor: 'Anchor' };
  const ratings = { free: 'Remembered on her own', cued: 'Remembered with a cue', struggled: 'Needed a gentle reveal' };
  let last = '';
  let waiting = false;

  async function refresh() {
    const state = window.DEMO ?? await (await fetch('state')).json();
    const snapshot = JSON.stringify(state);
    if (snapshot === last) return;
    last = snapshot;
    render(state);
  }

  function render(state) {
    const { chat, moments, activeId, due, whatsapp, person } = state;
    waiting = moments?.some((m) => m.phase === 'awaiting' || m.phase === 'hinted');

    const el = document.getElementById('chat');
    el.innerHTML = (chat || []).map((line) => `
      <div class="bubble ${line.from}">
        <span class="who">${escape(names[line.from] || line.from)}</span>
        ${escape(line.text)}
        ${line.mediaUrl ? `<img src="${escape(line.mediaUrl)}" alt="">` : ''}
      </div>`).join('');
    el.scrollTop = el.scrollHeight;

    document.getElementById('wa-note').textContent = window.DEMO
      ? 'Recorded demo'
      : whatsapp ? 'Connected to WhatsApp' : 'Simulated group · wire Twilio for live WhatsApp';

    const active = moments?.find((m) => m.id === activeId);
    const list = (moments || []).map((m) => `
      <div class="moment">
        <div><b>${escape(m.who)}</b> · ${escape(m.what)} · ${escape(m.when)}</div>
        <div class="muted">Next in ${m.gapDays} day${m.gapDays === 1 ? '' : 's'} · ${new Date(m.nextDue).toLocaleString()}</div>
        ${m.rating ? `<span class="chip ${m.rating}">${ratings[m.rating]}</span>` : '<span class="muted">Not practised yet</span>'}
        ${m.phase !== 'idle' ? `<div class="muted">Phase: ${escape(m.phase)}</div>` : ''}
      </div>`).join('') || '<div class="muted">Waiting for the family to share a moment…</div>';

    document.getElementById('hood').innerHTML = `
      <h2>For ${escape(person?.name || 'Athina')}</h2>
      <div class="muted">${escape(person?.context || '')}</div>
      <h2>Spaced retrieval</h2>
      <div class="next">${(due || []).length} due now</div>
      <div class="muted">Free recall doubles the wait. A cue holds it. A struggle resets to tomorrow.</div>
      <div class="actions">
        <button id="bring" ${!(moments || []).length || waiting || window.DEMO ? 'disabled' : ''}>Bring a moment back</button>
        <button class="secondary" id="advance" ${!(moments || []).length || window.DEMO ? 'disabled' : ''}>Mark next due now</button>
      </div>
      ${waiting ? `
        <h2>Athina's reply</h2>
        <div class="muted">${escape(active?.question || '')}</div>
        <div class="reply-row">
          <input id="reply" placeholder="Maria… she held Sofia's hand" ${window.DEMO ? 'disabled' : ''}>
          <button id="send-reply" ${window.DEMO ? 'disabled' : ''}>Send</button>
          <button class="secondary" id="hesitate" ${window.DEMO ? 'disabled' : ''}>Hesitate</button>
        </div>` : ''}
      <h2>Saved moments</h2>
      ${list}
      ${moments?.length && !window.DEMO ? `<h2>Share</h2><a href="demo.html" download>⬇ Download offline demo</a>` : ''}
    `;

    document.getElementById('bring')?.addEventListener('click', async () => {
      await fetch('bring-back', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
      last = ''; refresh();
    });
    document.getElementById('advance')?.addEventListener('click', async () => {
      const first = moments.find((m) => m.phase === 'idle');
      if (!first) return;
      first.nextDue = new Date().toISOString();
      await fetch('bring-back', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ momentId: first.id }) });
      last = ''; refresh();
    });
    document.getElementById('send-reply')?.addEventListener('click', () => sendReply(document.getElementById('reply').value));
    document.getElementById('hesitate')?.addEventListener('click', () => sendReply("I'm not sure…"));
    document.getElementById('reply')?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') sendReply(event.target.value);
    });
  }

  async function sendReply(text) {
    await fetch('reply', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
    last = ''; refresh();
  }

  document.getElementById('compose').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (window.DEMO) return;
    const input = document.getElementById('news');
    const text = input.value.trim() || input.placeholder;
    const from = document.getElementById('from').value;
    input.value = '';
    await fetch('moment', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, from }) });
    last = ''; refresh();
  });

  if (window.DEMO) {
    document.querySelector('header span').textContent = 'Recorded demo — scroll the chat.';
    document.getElementById('compose').style.display = 'none';
    render(window.DEMO);
  } else {
    refresh();
    setInterval(refresh, 1000);
  }
</script>
</body>
</html>
